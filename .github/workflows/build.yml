name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}
          restore-keys: vcpkg-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 53bef8994c541b6561884a8395ea35715ece75db

      - name: Diagnostics
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_ROOT"
          cmake --version
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset skyrim

      - name: Build
        shell: pwsh
        run: cmake --build build/skyrim --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SoundRecordDistributor
          path: build/skyrim/Release/SoundRecordDistributor.dll
          if-no-files-found: error
