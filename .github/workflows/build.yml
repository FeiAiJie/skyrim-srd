name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}
          restore-keys: vcpkg-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 53bef8994c541b6561884a8395ea35715ece75db

      # lukka/run-vcpkg sets VCPKG_BINARY_SOURCES=clear;x-gha,readwrite which
      # requires ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL in the vcpkg subprocess.
      # Override it here to use a plain filesystem cache instead.
      - name: Override vcpkg binary cache to filesystem
        shell: pwsh
        run: |
          "VCPKG_BINARY_SOURCES=clear;files,C:/vcpkg-cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # vcpkg_fixup_pkgconfig in this baseline tries to download pkgconf-1~2.1.0-1
      # from MSYS2 mirrors, which return 404. Provide pkg-config via choco so vcpkg
      # finds it in PATH and skips the MSYS2 download entirely.
      - name: Install pkg-config
        shell: pwsh
        run: choco install pkgconfiglite --yes --no-progress

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset skyrim

      - name: Build
        shell: pwsh
        run: cmake --build build/skyrim --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SoundRecordDistributor
          path: build/skyrim/Release/SoundRecordDistributor.dll
          if-no-files-found: error
